<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抽卡 Overlay</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Segoe UI,system-ui,sans-serif;color:#fff}.stage{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}.title{font-size:30px;text-shadow:0 2px 8px #0008}.cards{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));grid-template-rows:repeat(2,minmax(140px,1fr));gap:16px;align-items:center;justify-content:center;min-height:360px;width:min(92vw,980px)}.cards.single{display:flex;min-height:230px;justify-content:center}.card{width:min(16vw,170px);height:min(18vh,180px);min-width:110px;min-height:130px;border-radius:12px;border:3px solid #fff8;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;box-shadow:0 12px 35px #0008;transform:rotateY(90deg);opacity:0}.card.show{animation:flip .55s ease forwards}.card.EMPTY{background:linear-gradient(145deg,#566274,#252a34)}.card.R{background:linear-gradient(145deg,#42a5f5,#174b83)}.card.SR{background:linear-gradient(145deg,#b46cff,#54228c)}.card.SSR{background:linear-gradient(145deg,#ffb83d,#b54b12)}.card.UR{background:linear-gradient(145deg,#ff5c8a,#7c123f);box-shadow:0 0 45px #ff4f91aa}@keyframes flip{to{transform:rotateY(0);opacity:1}}.meta{font-size:18px;color:#e4e9f2;text-shadow:0 2px 7px #000}.pity{font-size:14px;color:#c9d4e5}</style><body><main class="stage"><div id="title" class="title">等待抽卡</div><div id="cards" class="cards"></div><div id="meta" class="meta"></div><div id="pity" class="pity"></div></main><script>const labels={EMPTY:'N',R:'R',SR:'SR',SSR:'SSR',UR:'UR'},title=document.getElementById('title'),cards=document.getElementById('cards'),meta=document.getElementById('meta'),pity=document.getElementById('pity');function play(data){cards.innerHTML='';cards.classList.toggle('single',data.results.length===1);title.textContent=`${data.participant.name} 的抽卡结果`;meta.textContent=`本次 ${data.results.length} 抽 · 累计 ${data.participant.totalDraws} 抽`;pity.textContent='保底计数：'+Object.entries(data.participant.pity).filter(([k])=>!['EMPTY','R'].includes(k)).map(([k,v])=>`${labels[k]} ${v}`).join(' · ');const delay=data.revealMode==='instant'?0:650;data.results.forEach((r,i)=>setTimeout(()=>{const el=document.createElement('div');el.className=`card ${r.rarity}`;el.textContent=labels[r.rarity];cards.appendChild(el);requestAnimationFrame(()=>el.classList.add('show'))},i*delay))}let seq=0;async function poll(){try{const r=await fetch('/api/events?after='+seq);const d=await r.json();seq=d.seq;if(d.event)play(d.event)}catch{}setTimeout(poll,300)}poll();</script></body></html>
