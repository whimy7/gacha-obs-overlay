<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抽卡控制台</title><style>body{margin:0;padding:24px;max-width:1080px;margin:auto;background:#12151c;color:#e9edf5;font:15px Segoe UI,system-ui}h1{font-size:26px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#1b202b;border:1px solid #30394a;border-radius:8px;padding:16px}label{display:block;color:#b7c1d1;font-size:13px;margin:8px 0}input,select,button{font:inherit}input,select{width:100%;padding:8px;background:#11151d;color:#fff;border:1px solid #3a465a;border-radius:5px}button{padding:9px 13px;border:0;border-radius:5px;background:#4d7cff;color:#fff;cursor:pointer;margin:4px 4px 0 0}.danger{background:#a74550}.secondary{background:#384355}.row{display:flex;gap:8px}.row>*{flex:1}.muted{color:#95a1b5;font-size:13px}.status{min-height:20px;color:#8ed1a4}.prob-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.people{max-height:170px;overflow:auto}.person{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #2b3341;cursor:pointer}.active{background:#263555}.full{grid-column:1/-1}@media(max-width:760px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style><body><h1>抽卡 Overlay 控制台</h1><div class="grid"><section class="panel"><h2>观众</h2><div class="row"><input id="name" placeholder="输入观众姓名"><button id="add">新增</button></div><div id="people" class="people"></div><div id="selected" class="muted">未选择观众</div><button id="draw1">单抽</button><button id="draw10">十连</button><button id="reset" class="danger">重置当前观众</button><button id="remove" class="danger">删除当前观众</button></section><section class="panel"><h2>概率与保底</h2><div id="probs" class="prob-grid"></div><div id="rules" class="prob-grid"></div><button id="save" class="secondary">保存规则和概率</button><div id="status" class="status"></div></section><section class="panel full"><h2>十连设置</h2><label>十连模式<select id="tenMode"><option value="random">纯随机十连</option><option value="constrained">公平约束十连</option></select></label><label><input type="checkbox" id="constraints" checked> 启用十连约束</label><label>SR + R 最大数量<input id="maxLow" type="number" min="0" max="10" value="2"></label><label>显示方式<select id="revealMode"><option value="sequence">依次翻牌</option><option value="instant">同时显示</option></select></label><h2>演示控制</h2><label>控制类型<select id="forceMode"><option value="none">不指定，按概率</option><option value="atLeast">至少出现一张所选卡</option><option value="maxRarity">最高不超过所选卡</option></select></label><label>目标等级<select id="forced"><option value="">请选择</option><option value="EMPTY">N</option><option value="R">R</option><option value="SR">SR</option><option value="SSR">SSR</option><option value="UR">UR</option></select></label><label><input type="checkbox" id="demo"> 演示模式（默认不计入正式数据）</label><label><input type="checkbox" id="countDemo"> 演示结果计入记录</label><button id="export" class="secondary">导出 JSON</button><button id="test" class="secondary">测试 Overlay</button><button id="resetAll" class="danger">清空全部观众数据</button><p class="muted">公平约束：SSR/UR互斥且同种最多一张；出现高级牌时其余为N；无高级牌时SR+R不超过上限。</p></section></div><script>
const labels={EMPTY:'N',R:'R',SR:'SR',SSR:'SSR',UR:'UR'},rarities=Object.keys(labels),$=id=>document.getElementById(id);let state={people:[],selected:null,settings:null};const api=async(url,opt)=>{const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d};const show=e=>$('status').textContent=e.message||e;
function render(){$('people').innerHTML=state.people.map(p=>`<div class="person ${state.selected?.id===p.id?'active':''}" data-id="${p.id}"><span>${p.name}</span><span>${p.totalDraws} 抽</span></div>`).join('');document.querySelectorAll('.person').forEach(x=>x.onclick=()=>{state.selected=state.people.find(p=>p.id==x.dataset.id);render()});$('selected').textContent=state.selected?`当前：${state.selected.name}，总抽数 ${state.selected.totalDraws}，保底：${JSON.stringify(state.selected.pity)}`:'未选择观众'}
async function load(){state.settings=await api('/api/settings');$('tenMode').value=state.settings.tenPullMode||'random';$('constraints').checked=state.settings.constraintEnabled!==false;$('maxLow').value=state.settings.maxLow??2;$('revealMode').value=state.settings.revealMode||'sequence';state.people=await api('/api/participants');$('probs').innerHTML=rarities.map(r=>`<label>${labels[r]}<input id="p-${r}" type="number" min="0" step="0.1" value="${state.settings.probabilities[r]}"></label>`).join('');$('rules').innerHTML=rarities.slice(2).map(r=>`<label>${labels[r]}保底<input id="rule-${r}" type="number" min="0" step="1" value="${state.settings.pityRules.find(x=>x.rarity===r)?.limit||''}" placeholder="不启用"></label>`).join('');render()}async function refresh(){state.people=await api('/api/participants');if(state.selected)state.selected=state.people.find(p=>p.id===state.selected.id)||null;render()}
$('add').onclick=async()=>{try{await api('/api/participants',{method:'POST',body:JSON.stringify({name:$('name').value})});$('name').value='';await refresh()}catch(e){show(e)}};$('save').onclick=async()=>{try{const probabilities=Object.fromEntries(rarities.map(r=>[r,$('p-'+r).value]));const pityRules=rarities.slice(2).map(r=>({rarity:r,limit:$('rule-'+r).value,enabled:Boolean($('rule-'+r).value)}));state.settings=await api('/api/settings',{method:'POST',body:JSON.stringify({probabilities,pityRules,tenPullMode:$('tenMode').value,constraintEnabled:$('constraints').checked,maxLow:$('maxLow').value,revealMode:$('revealMode').value})});show('已保存')}catch(e){show(e)}};async function draw(count){if(!state.selected)return show('请先选择观众');try{await api(`/api/participants/${state.selected.id}/draw`,{method:'POST',body:JSON.stringify({count,mode:$('demo').checked?'demo':'fair',forcedRarity:$('forced').value||undefined,forceMode:$('forceMode').value,countDemo:$('countDemo').checked})});await refresh()}catch(e){show(e)}}$('draw1').onclick=()=>draw(1);$('draw10').onclick=()=>draw(10);$('reset').onclick=async()=>{if(state.selected)await api(`/api/participants/${state.selected.id}/reset`,{method:'POST'});await refresh()};$('remove').onclick=async()=>{if(state.selected)await api(`/api/participants/${state.selected.id}`,{method:'DELETE'});state.selected=null;await refresh()};$('resetAll').onclick=async()=>{if(confirm('确定清空全部观众和抽卡记录吗？')){await api('/api/reset',{method:'POST'});state.selected=null;await refresh()}};$('export').onclick=async()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(await api('/api/export'),null,2)],{type:'application/json'}));a.download='gacha-export.json';a.click()};$('test').onclick=()=>{if(!state.selected)show('请先选择观众');else draw(1)};load().catch(show);
const applyButton=document.createElement('button');applyButton.textContent='应用十连与演示设置';applyButton.className='secondary';document.querySelector('.full').appendChild(applyButton);applyButton.onclick=async()=>{document.getElementById('save').click();applyButton.textContent='已应用';setTimeout(()=>applyButton.textContent='应用十连与演示设置',1600)};</script></body></html>
