<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抽卡控制台</title><style>
:root{font-family:Segoe UI,system-ui,sans-serif;color:#e9edf5;background:#12151c}*{box-sizing:border-box}body{margin:0;padding:28px;max-width:1100px;margin-inline:auto}h1{font-size:26px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#1b202b;border:1px solid #30394a;border-radius:8px;padding:18px}label{display:block;color:#aeb8c8;font-size:13px;margin:10px 0 5px}input,select,button{font:inherit}input,select{width:100%;padding:9px;background:#11151d;color:#fff;border:1px solid #3a465a;border-radius:5px}button{padding:10px 14px;border:0;border-radius:5px;background:#4d7cff;color:#fff;cursor:pointer;margin:5px 5px 0 0}.secondary{background:#384355}.danger{background:#a74550}.row{display:flex;gap:10px;align-items:end}.row>*{flex:1}.status{min-height:22px;color:#8ed1a4;margin-top:8px}.prob-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.participant-list{max-height:180px;overflow:auto;margin-top:10px}.person{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #2b3341;cursor:pointer}.person.active{background:#263555}.muted{color:#95a1b5;font-size:13px}.rules{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}@media(max-width:760px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style><body><h1>抽卡 Overlay 控制台</h1><div class="grid"><section class="panel"><h2>观众</h2><div class="row"><input id="name" placeholder="输入观众姓名"><button id="add">新增</button></div><div id="people" class="participant-list"></div><div id="selected" class="muted">未选择观众</div><button id="draw1">单抽</button><button id="draw10">十连</button><button id="reset" class="danger">重置当前观众</button></section><section class="panel"><h2>概率</h2><div class="prob-grid" id="probs"></div><p class="muted">留空将使用默认概率：70 / 20 / 8 / 1.8 / 0.2。</p><h2>保底规则</h2><div id="rules" class="rules"></div><button id="save" class="secondary">保存规则和概率</button><div id="status" class="status"></div></section><section class="panel full"><h2>演示控制</h2><select id="forced"><option value="">随机结果</option><option value="EMPTY">空</option><option value="R">R</option><option value="SR">SR</option><option value="SSR">SSR</option><option value="UR">UR</option></select><label><input type="checkbox" id="demo"> 演示模式（默认不计入正式数据）</label><label><input type="checkbox" id="countDemo"> 演示结果计入记录</label><button id="export" class="secondary">导出 JSON</button><button id="test" class="secondary">测试 Overlay</button></section></div><script>
const labels={EMPTY:'空',R:'R',SR:'SR',SSR:'SSR',UR:'UR'},rarities=Object.keys(labels);let state={people:[],selected:null,settings:null};const $=id=>document.getElementById(id);const api=async(url,opt)=>{const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d};function show(e){$('status').textContent=e.message||e}
function render(){ $('people').innerHTML=state.people.map(p=>`<div class="person ${state.selected?.id===p.id?'active':''}" data-id="${p.id}"><span>${p.name}</span><span>${p.totalDraws} 抽</span></div>`).join('');document.querySelectorAll('.person').forEach(x=>x.onclick=()=>{state.selected=state.people.find(p=>p.id==x.dataset.id);render()});$('selected').textContent=state.selected?`当前：${state.selected.name}，总抽数 ${state.selected.totalDraws}，保底：${JSON.stringify(state.selected.pity)}`:'未选择观众'}
async function load(){state.settings=await api('/api/settings');state.people=await api('/api/participants');$('probs').innerHTML=rarities.map(r=>`<label>${labels[r]}<input id="p-${r}" type="number" min="0" step="0.1" value="${state.settings.probabilities[r]}"></label>`).join('');$('rules').innerHTML=rarities.slice(2).map(r=>{const rule=state.settings.pityRules.find(x=>x.rarity===r)||{};return `<label>${labels[r]} 保底抽数<input id="rule-${r}" type="number" min="0" step="1" value="${rule.limit||''}" placeholder="不启用"></label>`}).join('');render()};async function refresh(){state.people=await api('/api/participants');if(state.selected)state.selected=state.people.find(p=>p.id===state.selected.id)||null;render()}
$('add').onclick=async()=>{try{await api('/api/participants',{method:'POST',body:JSON.stringify({name:$('name').value})});$('name').value='';await refresh()}catch(e){show(e)}};$('save').onclick=async()=>{try{const probabilities=Object.fromEntries(rarities.map(r=>[r,$('p-'+r).value]));const pityRules=rarities.slice(2).map(r=>({rarity:r,limit:$('rule-'+r).value,enabled:Boolean($('rule-'+r).value)}));state.settings=await api('/api/settings',{method:'POST',body:JSON.stringify({probabilities,pityRules})});show('已保存')}catch(e){show(e)}};async function draw(count,forced){if(!state.selected)return show('请先选择观众');try{await api(`/api/participants/${state.selected.id}/draw`,{method:'POST',body:JSON.stringify({count,mode:$('demo').checked?'demo':'fair',forcedRarity:forced||undefined,countDemo:$('countDemo').checked})});await refresh()}catch(e){show(e)}}$('draw1').onclick=()=>draw(1,$('forced').value);$('draw10').onclick=()=>draw(10,$('forced').value);$('reset').onclick=async()=>{if(!state.selected)return;await api(`/api/participants/${state.selected.id}/reset`,{method:'POST'});await refresh()};$('export').onclick=async()=>{const d=await api('/api/export');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='gacha-export.json';a.click()};$('test').onclick=()=>draw(1,'UR');load().catch(show);
</script></body></html>
